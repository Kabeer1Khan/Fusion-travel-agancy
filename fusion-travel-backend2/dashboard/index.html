<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fusion Travel · Admin</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B2A33'/%3E%3Cpath d='M7 18l18-8-6 14-3-6z' fill='%23F0B429'/%3E%3C/svg%3E">
</head>
<body>

  <!-- ============ Login ============ -->
  <main id="login-view" class="login" hidden>
    <div class="login-art" aria-hidden="true">
      <svg viewBox="0 0 400 300" class="login-map">
        <path d="M20 250 C 90 120, 180 280, 250 140 S 360 60, 380 40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
        <circle cx="20" cy="250" r="6" fill="currentColor"/>
        <circle cx="380" cy="40" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <p class="login-art-text">Every booking is a trip somebody has been waiting for.</p>
    </div>
    <form id="login-form" class="login-card" novalidate>
      <h1>Fusion Travel</h1>
      <p class="muted">Sign in with your admin account to manage bookings and packages.</p>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <label class="field">Email
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label class="field">Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign in</button>
    </form>
  </main>

  <!-- ============ App ============ -->
  <div id="app-view" class="shell" hidden>
    <aside class="side" id="side">
      <a class="brand" href="#overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 18l18-8-6 14-3-6z" fill="currentColor"/></svg>
        </span>
        <span>Fusion Travel<small>Admin</small></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#overview" data-route="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-3H4z"/></svg>Overview</a>
        <a href="#bookings" data-route="bookings"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4zM14 6v12"/></svg>Bookings<span class="count" id="count-bookings" hidden></span></a>
        <a href="#packages" data-route="packages"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 1 7 7c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 7-7zm0 5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>Packages</a>
        <a href="#inquiries" data-route="inquiries"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Inquiries<span class="count" id="count-inquiries" hidden></span></a>
        <a href="#reviews" data-route="reviews"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Reviews</a>
        <a href="#customers" data-route="customers"><svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/></svg>Customers</a>
      </nav>
      <div class="side-foot">
        <div class="who"><span class="avatar" id="who-avatar">A</span><span><b id="who-name">Admin</b><small id="who-email"></small></span></div>
        <button class="btn btn-ghost-light" data-action="logout" type="button">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="icon-btn menu-btn" data-action="toggle-menu" type="button" aria-label="Open menu" aria-controls="side">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="page-title">Overview</h1>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </div>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
